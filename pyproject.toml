[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "build-or-bust"
version = "0.1.0"
description = "Resumable product intake and evidence-backed discovery research"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "mcp>=2.1,<3",
  "openai>=1.68,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
build-or-bust = "build_or_bust.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/build_or_bust"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
